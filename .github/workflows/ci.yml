name: Validate platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_CACHE: "1"
      EXPO_PUBLIC_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:functions
      - run: npm run test:functions
      - run: npm run test:db
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:export
      - run: npm run test:e2e
      - name: Build Pages subdirectory
        run: npm run build:web
        env:
          EXPO_PUBLIC_WEB_BASE_PATH: /convite-felipe-e-lais
          EXPO_PUBLIC_WEB_BASE_URL: https://felipecontaremota-dot.github.io/convite-felipe-e-lais
      - name: Validate Pages export and 404 fallback
        run: npm run test:export
        env:
          EXPO_PUBLIC_WEB_BASE_PATH: /convite-felipe-e-lais
