name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_CACHE: "1"
      EXPO_PUBLIC_WEB_BASE_PATH: /convite-felipe-e-lais
      EXPO_PUBLIC_WEB_BASE_URL: https://felipecontaremota-dot.github.io/convite-felipe-e-lais
      EXPO_PUBLIC_EVENT_ID: 00000000-0000-4000-8000-000000000001
      EXPO_PUBLIC_DEMO_MODE: "false"
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_EMBED_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_EMBED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - run: npx playwright install --with-deps chromium
      - run: npm run test:export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
